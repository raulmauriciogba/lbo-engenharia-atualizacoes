<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f"><title>LBO Campo</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f4f6fa;--card:#fff;--fg:#14263b;--mut:#5e6f83;--bd:#dde4ee;--ac:#2563eb;--ok:#15803d;--warn:#b45309;--bad:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#0b1422;--card:#132235;--fg:#e7eef8;--mut:#93a6bd;--bd:#253a52;--ac:#4c8dff;--ok:#34c47c;--warn:#f2b441;--bad:#f26b6b}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,'Segoe UI',Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px);padding-top:max(12px,env(safe-area-inset-top));background:#1f3a5f;color:#fff}
header b{font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header button{background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
main{padding:14px 16px 90px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:4px 0 12px}p.m{color:var(--mut);margin:4px 0 12px;font-size:13.5px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 4px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;font-size:16px}
button.p{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px;font-weight:700;margin-top:14px}
button.p:disabled{opacity:.5}
.list button{display:flex;width:100%;align-items:center;gap:12px;text-align:left;padding:13px 14px;margin:0 0 8px;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:12px;font:inherit}
.list button span:first-child{flex:1;min-width:0}.list button span:not(:first-child){flex:none}.list small{display:block;color:var(--mut);font-size:12.5px}
.bar{height:7px;border-radius:5px;background:var(--bd);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.pct{font-weight:700;font-size:14px;white-space:nowrap}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.quick button{padding:10px 0;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font-weight:700;font-size:15px}
.lk{display:block;margin:12px auto 0;background:none;border:0;color:var(--ac,#2563eb);font-size:14px;text-decoration:underline;cursor:pointer}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}.msg.e{background:#c6282820;color:var(--bad)}.msg.o{background:#15803d20;color:var(--ok)}.msg.w{background:#b4530920;color:var(--warn)}
.fila{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--bd);font-size:13.5px;display:flex;gap:10px;align-items:center}
.fila[hidden]{display:none}.fila b{flex:1}.fila button{padding:8px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.back{background:none;border:0;color:var(--ac);font-size:15px;padding:0;margin-bottom:8px}
.efl{display:grid;grid-template-columns:1fr 40px 64px 40px 34px;gap:6px;margin-top:8px;align-items:center}.efl input{padding:10px}.efl .q{text-align:center}.efl button{height:42px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font-size:18px;font-weight:700}.efl .x{color:var(--mut);font-size:16px}
button.add{margin-top:10px;padding:10px 14px;border:1px dashed var(--bd);border-radius:10px;background:transparent;color:var(--ac);font:inherit;font-weight:600}
.list button.ef{border-color:var(--ac)}
.tag{font-size:11.5px;padding:2px 7px;border-radius:999px;background:var(--bd);color:var(--mut);white-space:nowrap}
</style></head><body>
<header><b id="t">LBO Campo</b><button id="sair" hidden>Sair</button></header>
<main id="app"></main>
<div class="fila" id="fila" hidden><b id="filaTxt"></b><button id="filaBtn">Enviar agora</button></div>
<script>
'use strict';
const $=s=>document.querySelector(s),app=$('#app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fq=v=>(Number(v)||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=ls.get('lboCampoSessao',null),obra=null,pac=null,regs=[];
if(S&&!S.fb)S=null; // sessão antiga (login do Supabase): pede para entrar de novo pelo Firebase
// Login igual ao do programa: Firebase (e-mail e senha do LBO).
const FB_KEY='AIzaSyCrsI2esZMITVDb-mhZs11HqoAV2g43fhM',FB_PROJ='lbo-engenharia';
function claims(t){try{const b=String(t).split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(Array.from(atob(b),c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join('')));}catch(e){throw Error('Resposta de login inválida.');}}
function sessao(j,old){const tok=j.idToken||j.id_token,uid=j.localId||j.user_id,c=claims(tok);
 if(c.iss!=='https://securetoken.google.com/'+FB_PROJ||c.aud!==FB_PROJ||c.sub!==uid||c.role!=='authenticated'||c.lbo_legacy_uid!==uid)throw Error('Esta conta ainda não foi vinculada ao LBO online. Peça ao administrador para concluir a migração.');
 if(old&&old.user&&old.user.id!==uid)throw Error('A renovação retornou outra conta. Entre novamente.');
 return {fb:1,access_token:tok,refresh_token:j.refreshToken||j.refresh_token,expires_at:c.exp*1000,user:{id:uid,email:j.email||c.email||old?.user?.email||''}};}
async function fb(url,body,form){let r;try{r=await fetch(url+'?key='+FB_KEY,{method:'POST',headers:{'Content-Type':form?'application/x-www-form-urlencoded':'application/json','X-Firebase-Locale':'pt'},body:form?new URLSearchParams(body).toString():JSON.stringify(body)});}catch(e){throw Error('Sem conexão. Tente de novo quando tiver sinal.');}
 const j=await r.json().catch(()=>({}));if(!r.ok){const c=String(j?.error?.message||'');
  throw Error(/INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND|USER_NOT_FOUND|INVALID_EMAIL/.test(c)?'E-mail ou senha incorretos.':/TOO_MANY/.test(c)?'Muitas tentativas. Aguarde alguns minutos.':/USER_DISABLED/.test(c)?'Esta conta está desativada.':/TOKEN_EXPIRED|INVALID_REFRESH|USER_NOT_FOUND/.test(c)?'Sessão expirada. Entre novamente.':'Falha no login ('+(c||r.status)+').');}
 return j;}
async function entrar(email,senha){S=sessao(await fb('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword',{email,password:senha,returnSecureToken:true}));ls.set('lboCampoSessao',S);}
async function refresh(){if(!S?.refresh_token)throw Error('Sessão expirada. Entre novamente.');S=sessao(await fb('https://securetoken.googleapis.com/v1/token',{grant_type:'refresh_token',refresh_token:S.refresh_token},true),S);ls.set('lboCampoSessao',S);}
async function esqueci(email){await fb('https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode',{requestType:'PASSWORD_RESET',email}).catch(e=>{if(!/incorretos/.test(e.message))throw e;});}
// Dados no Firebase (Firestore). O Supabase foi desligado em 02/11/2026.
const FS='https://firestore.googleapis.com/v1/projects/'+FB_PROJ+'/databases/(default)/documents';
function fv(x){if(x===null||x===undefined)return {nullValue:null};if(typeof x==='boolean')return {booleanValue:x};if(typeof x==='number')return Number.isInteger(x)?{integerValue:String(x)}:{doubleValue:x};if(typeof x==='string')return {stringValue:x};if(Array.isArray(x))return {arrayValue:x.length?{values:x.map(fv)}:{}};return {mapValue:{fields:Object.fromEntries(Object.entries(x).filter(([k,v])=>v!==undefined).map(([k,v])=>[k,fv(v)]))}};}
function vf(v){if(!v||'nullValue' in v)return null;if('booleanValue' in v)return v.booleanValue;if('integerValue' in v)return Number(v.integerValue);if('doubleValue' in v)return v.doubleValue;if('stringValue' in v)return v.stringValue;if('timestampValue' in v)return v.timestampValue;if('arrayValue' in v)return (v.arrayValue.values||[]).map(vf);if('mapValue' in v)return ff(v.mapValue.fields);return null;}
function ff(f){const o={};for(const [k,v] of Object.entries(f||{}))o[k]=vf(v);return o;}
async function fsReq(url,body,method,_retry){if(!S)throw Error('Entre novamente.');if(Date.now()>(S.expires_at||0)-60000)await refresh();
 let r;try{r=await fetch(url,{method:method||(body?'POST':'GET'),headers:{Authorization:'Bearer '+S.access_token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});}catch(e){throw Error('Sem conexão. Tente de novo quando tiver sinal.');}
 if(r.status===401){if(_retry){S=null;ls.set('lboCampoSessao',null);throw Error('Entre novamente.');}await refresh();return fsReq(url,body,method,1);}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){const m=String(j?.error?.message||j?.[0]?.error?.message||t);const st=j?.error?.status||'';const e=Error(r.status===403||/PERMISSION/.test(st)?'Sua conta não tem permissão nesta obra (precisa ser dono, executor, supervisor ou premium).':r.status===404?'Não encontrado.':m||('Erro '+r.status));e.status=r.status;e.code=st;throw e;}
 return j;}
async function consulta(parent,col,where){const sq={from:[{collectionId:col}]};if(where)sq.where={fieldFilter:{field:{fieldPath:where[0]},op:'EQUAL',value:fv(where[1])}};
 const res=await fsReq((parent?FS+'/'+parent:FS)+':runQuery',{structuredQuery:sq});return (res||[]).filter(x=>x.document).map(x=>({...ff(x.document.fields),__name:x.document.name}));}
async function doc(path){try{const d=await fsReq(FS+'/'+path);return ff(d.fields);}catch(e){if(e.status===404||e.status===403)return null;throw e;}}
const json=v=>{if(typeof v==='string'&&/^[\[{]/.test(v.trim())){try{return JSON.parse(v)}catch(e){}}return v;};
// Mesmas consultas de antes, agora no Firestore.
async function api(path,opt={}){
 const uid=S?.user?.id;
 if(path.startsWith('lbo_campo_pacotes?select=obra_id')){ // obras liberadas para o celular (dono ou participante)
  const ids=new Set();for(const p of await consulta(null,'lbo_participantes',['usuario_id',uid]))if(p.obra_id)ids.add(p.obra_id);
  for(const o of await consulta(null,'lbo_obras',['dono',uid]))ids.add(o.id||o.__name.split('/').pop());
  const out=[];for(const id of ids){const p=await doc('lbo_obras/'+id+'/campo_pacote/atual?mask.fieldPaths=obra_id&mask.fieldPaths=atualizado_em&mask.fieldPaths=obra_nome');if(p)out.push({obra_id:id,atualizado_em:p.atualizado_em,obra:{nome:p.obra_nome||'Obra'}});}
  return out.sort((a,b)=>String(b.atualizado_em||'').localeCompare(String(a.atualizado_em||'')));
 }
 let m=/^lbo_campo_pacotes\?select=conteudo,atualizado_em&obra_id=eq\.([^&]+)$/.exec(path);
 if(m){const p=await doc('lbo_obras/'+decodeURIComponent(m[1])+'/campo_pacote/atual');return p?[{conteudo:json(p.conteudo),atualizado_em:p.atualizado_em}]:[];}
 m=/^lbo_campo_registros\?select=[^&]+&obra_id=eq\.([^&]+)/.exec(path);
 if(m){const rows=await consulta('lbo_obras/'+decodeURIComponent(m[1]),'campo_registros');return rows.map(({__name,...r})=>r).sort((a,b)=>String(b.criado_em||'').localeCompare(String(a.criado_em||''))).slice(0,300);}
 if(path==='lbo_campo_registros'&&opt.method==='POST'){
  for(const r0 of JSON.parse(opt.body)){const id=String(r0.id||crypto.randomUUID()).replace(/[^A-Za-z0-9_-]/g,'_');const r={...r0,id,autor:uid,criado_em:new Date().toISOString(),importado_em:null};
   try{await fsReq(FS+':commit',{writes:[{update:{name:'projects/'+FB_PROJ+'/databases/(default)/documents/lbo_obras/'+r.obra_id+'/campo_registros/'+id,fields:fv(r).mapValue.fields},currentDocument:{exists:false}}]});}
   catch(e){if(!(e.status===409||/ALREADY_EXISTS/.test(e.code||e.message)))throw e;} // já enviado antes: não duplica
  }return null;}
 throw Error('Consulta não suportada: '+path);
}
function msg(cls,t){return '<div class="msg '+cls+'">'+esc(t)+'</div>';}
function login(err,ok){$('#t').textContent='LBO Campo';$('#sair').hidden=true;
 app.innerHTML='<div class="card"><h2>Registro de produção</h2><p class="m">Entre com o mesmo e-mail e senha do LBO Engenharia. Só são enviados dados leves (serviço, pavimento, quantidade, efetivo do dia e observação).</p>'+(err?msg('e',err):'')+(ok?msg('o',ok):'')+'<form id="f"><label>E-mail</label><input name="e" type="email" autocomplete="username" required><label>Senha</label><input name="s" type="password" autocomplete="current-password" required><button class="p">Entrar</button></form><button type="button" id="esq" class="lk">Esqueci a senha</button></div>';
 $('#f').e.value=ls.get('lboCampoEmail','');
 $('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{ls.set('lboCampoEmail',e.target.e.value.trim());await entrar(e.target.e.value.trim(),e.target.s.value);obras();}catch(x){login(x.message);}};
 $('#esq').onclick=async()=>{const em=$('#f').e.value.trim();if(!em){login('Digite o seu e-mail e toque de novo em "Esqueci a senha".');return;}try{await esqueci(em);login(null,'Se o e-mail estiver cadastrado, chegará um link para criar uma nova senha.');}catch(x){login(x.message);}};}
async function obras(){$('#sair').hidden=false;$('#t').textContent='LBO Campo';app.innerHTML='<p class="m">Carregando obras…</p>';
 try{const rows=await api('lbo_campo_pacotes?select=obra_id,atualizado_em,obra:conteudo->obra&order=atualizado_em.desc');ls.set('lboCampoObras',rows);mostrarObras(rows);}
 catch(e){const rows=ls.get('lboCampoObras',null);if(rows){mostrarObras(rows,'Sem conexão: mostrando a última lista salva.');}else app.innerHTML=msg('e',e.message)+'<button class="p" onclick="obras()">Tentar de novo</button>';}}
function mostrarObras(rows,aviso){app.innerHTML=(aviso?msg('w',aviso):'')+'<h2>Obras</h2>'+(rows.length?'<div class="list">'+rows.map(r=>'<button data-o="'+esc(r.obra_id)+'"><span><b>'+esc(r.obra?.nome||'Obra')+'</b><small>Atualizada no programa em '+esc(new Date(r.atualizado_em).toLocaleString('pt-BR'))+'</small></span>›</button>').join('')+'</div>':'<p class="m">Nenhuma obra liberada para o celular. No programa, abra a obra e use Linha de Balanço → Mais ações → Campo (celular) → Publicar para o celular.</p>');
 app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>abrirObra(b.dataset.o));}
async function abrirObra(id){app.innerHTML='<p class="m">Carregando…</p>';
 try{const [p]=await api('lbo_campo_pacotes?select=conteudo,atualizado_em&obra_id=eq.'+encodeURIComponent(id));if(!p)throw Error('Obra não encontrada.');pac=p.conteudo;obra={id,nome:pac.obra?.nome||'Obra'};ls.set('lboCampoPac_'+id,pac);
  regs=await api('lbo_campo_registros?select=servico_id,setor,data,qtd,autor_email,criado_em,importado_em&obra_id=eq.'+encodeURIComponent(id)+'&order=criado_em.desc&limit=300');ls.set('lboCampoRegs_'+id,regs);}
 catch(e){pac=ls.get('lboCampoPac_'+id,null);regs=ls.get('lboCampoRegs_'+id,[]);if(!pac){app.innerHTML=msg('e',e.message)+'<button class="p" onclick="obras()">Voltar</button>';return;}obra={id,nome:pac.obra?.nome||'Obra'};}
 servicos();}
function ultimo(sid,u){const s=pac.servicos.find(x=>x.id===sid);let best={qtd:Number(s?.exec?.[u-1])||0,data:s?.execData?.[u-1]||'',src:'programa'};
 const cands=[...regs.filter(r=>r.servico_id===sid&&r.setor===u),...fila().filter(r=>r.obra_id===obra.id&&r.servico_id===sid&&r.setor===u)];
 for(const r of cands)if(String(r.data)>=String(best.data)){best={qtd:Number(r.qtd),data:r.data,src:r.importado_em?'importado':(r.criado_em?'enviado':'na fila')};}return best;}
function servicos(){$('#t').textContent=obra.nome;
 const ef=efUltimo();app.innerHTML='<button class="back" onclick="obras()">‹ Obras</button><div class="list"><button id="efBtn" class="ef"><span><b>👷 Efetivo do dia</b><small>'+(ef?'Último: '+esc(ef.total+' pessoa'+(ef.total===1?'':'s')+' em '+ef.data.split('-').reverse().join('/'))+(ef.fila?' (na fila)':''):'Quantas pessoas trabalharam hoje, por função')+'</small></span>›</button></div><h2>Serviços</h2><div class="list">'+pac.servicos.map(s=>{const tot=s.dist.reduce((a,b)=>a+(+b||0),0),ex=s.dist.reduce((a,q,i)=>a+Math.min(+q||0,ultimo(s.id,i+1).qtd),0),p=tot?ex/tot*100:0;
  return '<button data-s="'+esc(s.id)+'"><span><b>'+esc(s.nome)+'</b><small>'+fq(ex)+' de '+fq(tot)+' '+esc(s.un)+'</small><div class="bar"><i style="width:'+p.toFixed(1)+'%"></i></div></span><span class="pct">'+p.toFixed(0)+'%</span></button>';}).join('')+'</div>';
 app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>setores(b.dataset.s));$('#efBtn').onclick=()=>efetivo();}
// Efetivo do dia: vai como um registro leve (servico_id "__efetivo__", qtd = total, obs = "Função=quantidade;...") e o programa leva para o RDO.
const EF='__efetivo__',efLimpa=v=>String(v||'').replace(/[;=\n\r]/g,' ').replace(/\s+/g,' ').trim().slice(0,40);
function efUltimo(){const l=ls.get('lboCampoEf_'+obra.id,null),q=fila().filter(r=>r.obra_id===obra.id&&r.servico_id===EF).at(-1);if(q)return {data:q.data,total:q.qtd,fila:1};return l?{data:l.data,total:l.total}:null;}
function efetivo(aviso,linhas,dataSel){const ult=ls.get('lboCampoEf_'+obra.id,null);
 const base=linhas||(ult?ult.linhas:(pac.funcoes||['Pedreiro','Servente']).slice(0,4).map(f=>({f,q:''})));
 const fun=(pac.funcoes||[]);
 app.innerHTML='<button class="back" id="bk">‹ Serviços</button><div class="card"><h2>Efetivo do dia</h2><p class="m">Pessoas que trabalharam na obra, por função. Vai para o RDO da data no programa.</p>'+(aviso?msg('e',aviso):'')+
 '<label>Data</label><input id="d" type="date" value="'+esc(dataSel||hoje())+'" max="'+hoje()+'"><datalist id="fl">'+fun.map(f=>'<option value="'+esc(f)+'">').join('')+'</datalist><div id="rows">'+base.map(efLinha).join('')+'</div>'+
 '<button type="button" class="add" id="add">+ Função</button><p class="m" id="tot"></p><button class="p" id="go">Enviar efetivo</button></div>';
 const total=()=>[...app.querySelectorAll('.efl')].reduce((a,r)=>a+Math.max(0,Math.floor(Number(r.querySelector('.q').value)||0)),0);
 const upd=()=>{const el=$('#tot');if(!el)return;const t=total();el.textContent=t?'Total: '+t+' pessoa'+(t===1?'':'s'):'';};
 const ler=()=>[...app.querySelectorAll('.efl')].map(r=>({f:r.querySelector('.f').value,q:r.querySelector('.q').value}));
 app.oninput=upd;upd();
 app.querySelectorAll('.efl .m1,.efl .p1').forEach(b=>b.onclick=()=>{const i=b.closest('.efl').querySelector('.q');i.value=Math.max(0,(Math.floor(Number(i.value)||0))+(b.classList.contains('p1')?1:-1));upd();});
 app.querySelectorAll('.efl .x').forEach(b=>b.onclick=()=>{const l=ler();l.splice([...app.querySelectorAll('.efl')].indexOf(b.closest('.efl')),1);efetivo(null,l.length?l:[{f:'',q:''}],$('#d').value);});
 $('#add').onclick=()=>{const l=ler();if(l.length<20)l.push({f:'',q:''});efetivo(null,l,$('#d').value);};
 $('#bk').onclick=servicos;
 $('#go').onclick=()=>{const d=$('#d').value;if(!d)return efetivo('Informe a data.',ler(),d);
  const m=new Map();for(const {f,q} of ler()){const n=efLimpa(f),v=Math.max(0,Math.min(999,Math.floor(Number(q)||0)));if(!n||!v)continue;const k=n.toLowerCase();m.set(k,{f:m.get(k)?.f||n.charAt(0).toUpperCase()+n.slice(1),q:(m.get(k)?.q||0)+v});}
  const l=[...m.values()];if(!l.length)return efetivo('Informe pelo menos uma função com o número de pessoas.',ler(),d);
  const obs=l.map(x=>x.f+'='+x.q).join(';');if(obs.length>300)return efetivo('Lista grande demais. Junte funções parecidas.',ler(),d);
  const tot=l.reduce((a,x)=>a+x.q,0),fq_=fila().filter(r=>!(r.obra_id===obra.id&&r.servico_id===EF&&r.data===d));
  fq_.push({obra_id:obra.id,servico_id:EF,setor:1,data:d,qtd:tot,obs,autor_email:S?.user?.email||null,local:Date.now()});ls.set('lboCampoFila',fq_);
  ls.set('lboCampoEf_'+obra.id,{data:d,total:tot,linhas:l.map(x=>({f:x.f,q:x.q}))});mostrarFila();enviar().finally(()=>{servicos();app.insertAdjacentHTML('afterbegin',msg('o','Efetivo de '+d.split('-').reverse().join('/')+' registrado: '+tot+' pessoa'+(tot===1?'':'s')+'.'));});};}
function efLinha(x){return '<div class="efl"><input class="f" list="fl" maxlength="40" placeholder="Função" value="'+esc(x.f||'')+'"><button type="button" class="m1">−</button><input class="q" inputmode="numeric" placeholder="0" value="'+esc(x.q===''||x.q==null?'':String(x.q))+'"><button type="button" class="p1">+</button><button type="button" class="x" aria-label="Remover">×</button></div>';}
function setores(sid){const s=pac.servicos.find(x=>x.id===sid);
 app.innerHTML='<button class="back" id="bk">‹ Serviços</button><h2>'+esc(s.nome)+'</h2><p class="m">Toque no pavimento para registrar a quantidade executada acumulada.</p><div class="list">'+pac.setores.map((n,i)=>{const q=+s.dist[i]||0;if(!(q>0))return '';const l=ultimo(sid,i+1),p=Math.min(100,l.qtd/q*100);
  return '<button data-u="'+(i+1)+'"><span><b>'+esc(n)+'</b><small>'+fq(l.qtd)+' de '+fq(q)+' '+esc(s.un)+(l.data?' · '+esc(l.data.split('-').reverse().join('/')):'')+'</small><div class="bar"><i style="width:'+p.toFixed(1)+'%"></i></div></span>'+(l.src==='na fila'?'<span class="tag">na fila</span>':l.src==='enviado'?'<span class="tag">enviado</span>':'')+'<span class="pct">'+p.toFixed(0)+'%</span></button>';}).join('')+'</div>';
 $('#bk').onclick=servicos;app.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>registrar(sid,+b.dataset.u));}
function registrar(sid,u,aviso){const s=pac.servicos.find(x=>x.id===sid),q=+s.dist[u-1]||0,l=ultimo(sid,u);
 app.innerHTML='<button class="back" id="bk">‹ '+esc(s.nome)+'</button><div class="card"><h2>'+esc(s.nome)+'<br><small style="color:var(--mut);font-size:15px">'+esc(pac.setores[u-1])+'</small></h2><p class="m">Planejado: '+fq(q)+' '+esc(s.un)+' · último registro: '+fq(l.qtd)+'</p>'+(aviso?msg('e',aviso):'')+
 '<label>Quantidade executada acumulada ('+esc(s.un)+')</label><input id="q" inputmode="decimal" value="'+String(l.qtd).replace('.',',')+'"><div class="quick"><button data-p="25">25%</button><button data-p="50">50%</button><button data-p="75">75%</button><button data-p="100">100%</button></div>'+
 '<label>Data</label><input id="d" type="date" value="'+hoje()+'" max="'+hoje()+'"><label>Observação (opcional)</label><textarea id="o" rows="2" maxlength="300" placeholder="Ex.: falta material na ala norte"></textarea><button class="p" id="go">Registrar</button></div>';
 $('#bk').onclick=()=>setores(sid);app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{$('#q').value=String(Math.round(q*b.dataset.p/100*1000)/1000).replace('.',',');});
 $('#go').onclick=()=>{const v=Number(String($('#q').value).replace(/\./g,'').replace(',','.'));if(!Number.isFinite(v)||v<0||v>q+1e-9)return registrar(sid,u,'Informe uma quantidade entre 0 e '+fq(q)+'.');if(!$('#d').value)return registrar(sid,u,'Informe a data.');
  const f=fila();f.push({obra_id:obra.id,servico_id:sid,setor:u,data:$('#d').value,qtd:v,obs:$('#o').value.trim().slice(0,300)||null,autor_email:S?.user?.email||null,local:Date.now()});ls.set('lboCampoFila',f);mostrarFila();enviar().finally(()=>setores(sid));};}
function fila(){return ls.get('lboCampoFila',[]);}
function mostrarFila(){const f=fila();$('#fila').hidden=!f.length;$('#filaTxt').textContent=f.length+' registro(s) aguardando envio';}
let enviando=false;
async function enviar(){if(enviando)return;const f=fila();if(!f.length){mostrarFila();return;}enviando=true;
 try{const body=f.map(({local,...r})=>({...r,id:'c'+S.user.id.slice(0,8)+'_'+local}));await api('lbo_campo_registros',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});
  regs=[...body.map(r=>({...r,criado_em:new Date().toISOString(),importado_em:null})),...regs];ls.set('lboCampoFila',fila().filter(x=>!f.some(y=>y.local===x.local)));}
 catch(e){/* sem conexão: fica na fila */}finally{enviando=false;mostrarFila();}}
$('#filaBtn').onclick=()=>enviar().then(()=>{if(obra&&pac)servicos();});
$('#sair').onclick=()=>{if(fila().length&&!confirm('Há registros na fila. Sair mesmo assim? Eles continuam guardados neste celular.'))return;S=null;ls.set('lboCampoSessao',null);login();};
window.addEventListener('online',()=>enviar());setInterval(()=>{if(navigator.onLine)enviar();},60000);
mostrarFila();if(S)obras();else login();
</script></body></html>
